name: PR Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
      - name: offline static checks and shellcheck
        run: bash scripts/run-offline-tests.sh --static-only

  regression-tests:
    name: regression-tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: offline regression tests (shard)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 2
        run: |
          set -euo pipefail
          mapfile -t all_tests < <(LC_ALL=C printf '%s\n' tests-*.sh | LC_ALL=C sort)
          shard_tests=()
          for idx in "${!all_tests[@]}"; do
            if (( idx % SHARD_TOTAL == SHARD_INDEX )); then
              shard_tests+=("${all_tests[$idx]}")
            fi
          done
          if ((${#shard_tests[@]} == 0)); then
            echo "No tests assigned to shard ${SHARD_INDEX}/${SHARD_TOTAL}"
            exit 0
          fi
          sudo -n bash scripts/run-offline-tests.sh --no-static --jobs 2 "${shard_tests[@]}"
