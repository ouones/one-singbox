name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: offline regression and static checks
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          sudo -n bash scripts/run-offline-tests.sh --jobs 2

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bump version and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main --tags --force
          matching_tag=""
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            for tag in $(git tag --list 'v1.*' --sort=-version:refname); do
              tag_commit="$(git rev-parse "${tag}^{commit}")"
              tag_parent="$(git rev-list --parents -n1 "$tag_commit" | cut -d' ' -f2)"
              if [[ "$tag_commit" == "$GITHUB_SHA" || "$tag_parent" == "$GITHUB_SHA" ]]; then
                matching_tag="$tag"
                break
              fi
            done
          fi

          if [[ -n "$matching_tag" ]]; then
            if [[ ! "$matching_tag" =~ ^v1\.[0-9]+$ ]]; then
              echo "Could not determine the current v1.N release version." >&2
              exit 1
            fi
            release_version="$matching_tag"
            release_commit="$(git rev-parse "${matching_tag}^{commit}")"
            git checkout --detach "$release_commit"
          else
            claimed=0
            for attempt in {1..10}; do
              git fetch origin main --tags --force
              git checkout --detach "$GITHUB_SHA"
              latest_tag="$(git tag --list 'v1.*' --sort=-version:refname | head -n1)"
              latest_minor="${latest_tag#v1.}"
              current_version="$(sed -n 's/^is_sh_ver=//p' sing-box.sh)"
              current_minor="${current_version#v1.}"
              if [[ ! "$latest_minor" =~ ^[0-9]+$ || ! "$current_minor" =~ ^[0-9]+$ ]]; then
                echo "Could not determine the current v1.N release version (latest=${latest_tag:-<empty>}, current=${current_version:-<empty>})." >&2
                exit 1
              fi
              if (( current_minor > latest_minor )); then
                release_minor="$current_minor"
              else
                release_minor=$((latest_minor + 1))
              fi
              release_version="v1.${release_minor}"
              sed -i "s/^is_sh_ver=.*/is_sh_ver=${release_version}/" sing-box.sh
              bash -n sing-box.sh
              git add sing-box.sh
              if ! git diff --cached --quiet; then
                git commit -m "chore: bump version to ${release_version}"
              fi
              release_commit="$(git rev-parse HEAD)"
              git tag -f "$release_version" "$release_commit"
              if git push origin "refs/tags/${release_version}"; then
                claimed=1
                break
              fi
              git tag -d "$release_version" >/dev/null 2>&1 || true
              sleep 2
            done
            if (( claimed == 0 )); then
              echo "Failed to claim a unique release tag after 10 attempts." >&2
              exit 1
            fi
          fi

          echo "delivery_version=${release_version}" >> "$GITHUB_ENV"
          echo "release_commit=${release_commit}" >> "$GITHUB_ENV"
      - name: build release package
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          tar zcvf .release-artifacts/code.tar.gz install.sh sing-box.sh src LICENSE README.md docs/usage.md assets/readme
      - name: verify package layout
        run: |
          set -euo pipefail
          archive=.release-artifacts/code.tar.gz
          members="$(tar tzf "$archive")"
          for required in src/core.sh src/meta.sh src/uri.sh src/route.sh src/node.sh src/relay.sh; do
            if ! grep -Fxq "$required" <<< "$members"; then
              echo "Release package is missing $required." >&2
              exit 1
            fi
          done
          if grep -Fxq 'core.sh' <<< "$members"; then
            echo "Release package must not contain the removed root management script." >&2
            exit 1
          fi
          archived_ver="$(tar -xOf "$archive" sing-box.sh | sed -n 's/^is_sh_ver=//p')"
          if [[ "$archived_ver" != "$delivery_version" ]]; then
            echo "Packaged sing-box.sh version ${archived_ver:-<empty>} does not match ${delivery_version}." >&2
            exit 1
          fi
      - name: record package checksum
        run: |
          set -euo pipefail
          sha256sum .release-artifacts/code.tar.gz > .release-artifacts/code.tar.gz.sha256
          checksum="$(cut -d ' ' -f1 .release-artifacts/code.tar.gz.sha256)"
          {
            echo '### Release package'
            echo
            echo "- version: ${delivery_version}"
            echo "- sha256: ${checksum}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish release
        uses: softprops/action-gh-release@v1
        with:
          files: .release-artifacts/code.tar.gz
          tag_name: ${{ env.delivery_version }}
          target_commitish: ${{ env.release_commit }}
          prerelease: false
          generate_release_notes: true
      - name: re-download and verify published asset
        run: |
          set -euo pipefail
          published_dir=.release-artifacts/published
          rm -rf "$published_dir"
          mkdir -p "$published_dir"
          gh release download "$delivery_version" -p code.tar.gz -D "$published_dir"
          archive="$published_dir/code.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "Published release is missing the code.tar.gz asset." >&2
            exit 1
          fi
          expected_sha256="$(cut -d ' ' -f1 .release-artifacts/code.tar.gz.sha256)"
          published_sha256="$(sha256sum "$archive" | cut -d ' ' -f1)"
          if [[ "$published_sha256" != "$expected_sha256" ]]; then
            echo "Published asset SHA-256 mismatch; the release is not the verified package." >&2
            exit 1
          fi
          python3 - "$archive" <<'PY'
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as package:
              members = package.getnames()
          required = [
              "src/core.sh",
              "src/meta.sh",
              "src/uri.sh",
              "src/route.sh",
              "src/node.sh",
              "src/relay.sh",
          ]
          missing = [m for m in required if m not in members]
          if missing:
              raise SystemExit(f"published asset is missing: {', '.join(missing)}")
          if "core.sh" in members:
              raise SystemExit("published asset must not contain the removed root management script")
          PY
          {
            echo '### Published release asset verified'
            echo
            echo "- version: ${delivery_version}"
            echo "- sha256: ${published_sha256}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: update main version
        run: |
          set -euo pipefail
          release_minor="${delivery_version#v1.}"
          for attempt in {1..10}; do
            git fetch origin main
            main_sha="$(git rev-parse origin/main)"
            main_version="$(git show origin/main:sing-box.sh | sed -n 's/^is_sh_ver=//p')"
            main_minor="${main_version#v1.}"
            if [[ "$main_minor" =~ ^[0-9]+$ ]] && (( main_minor >= release_minor )); then
              break
            fi
            if [[ "$main_sha" == "$GITHUB_SHA" && "$release_commit" != "$GITHUB_SHA" ]]; then
              if git push origin "${release_commit}:refs/heads/main"; then
                break
              fi
            else
              git checkout --detach origin/main
              sed -i "s/^is_sh_ver=.*/is_sh_ver=${delivery_version}/" sing-box.sh
              bash -n sing-box.sh
              git add sing-box.sh
              if git diff --cached --quiet; then
                break
              fi
              git commit -m "chore: bump version to ${delivery_version}"
              if git push origin HEAD:refs/heads/main; then
                break
              fi
            fi
            if (( attempt == 10 )); then
              echo "Failed to update main version to ${delivery_version} after 10 attempts." >&2
              exit 1
            fi
            sleep 2
          done
