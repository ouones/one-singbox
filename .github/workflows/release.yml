name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: offline regression and Bash syntax gate
        run: |
          set -euo pipefail
          shell_count=0
          while IFS= read -r -d '' shell_file; do
            bash -n "$shell_file"
            shell_count=$((shell_count + 1))
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if ((shell_count == 0)); then
            echo "No Bash scripts found for syntax validation." >&2
            exit 1
          fi
          sudo -n bash tests-menu-navigation.sh
          sudo -n bash tests-node-external-frontend.sh
          sudo -n bash tests-node-name-label.sh
          sudo -n bash tests-node-proxy-outbound.sh
          bash tests-update-script-reload.sh
          bash tests-block-cn.sh
          bash tests-skill-inventory.sh
          bash tests-terminology.sh

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: read and validate delivery version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^is_sh_ver=//p' sing-box.sh)"
          if [[ ! "$version" =~ ^v1\.[0-9]+$ ]]; then
            echo "Delivery version in sing-box.sh must be v1.N, got: ${version:-<empty>}" >&2
            exit 1
          fi
          echo "delivery_version=${version}" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists; skipping release for this merge." >> "$GITHUB_STEP_SUMMARY"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: build release package
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          mkdir -p .release-artifacts
          tar zcvf .release-artifacts/code.tar.gz install.sh sing-box.sh src LICENSE README.md docs/usage.md assets/readme
      - name: verify package layout
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          archive=.release-artifacts/code.tar.gz
          members="$(tar tzf "$archive")"
          if ! grep -Fxq 'src/core.sh' <<< "$members"; then
            echo "Release package is missing src/core.sh." >&2
            exit 1
          fi
          if grep -Fxq 'core.sh' <<< "$members"; then
            echo "Release package must not contain the removed root management script." >&2
            exit 1
          fi
      - name: record package checksum
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          sha256sum .release-artifacts/code.tar.gz > .release-artifacts/code.tar.gz.sha256
          checksum="$(cut -d ' ' -f1 .release-artifacts/code.tar.gz.sha256)"
          {
            echo '### Release package'
            echo
            echo "- version: ${delivery_version}"
            echo "- sha256: ${checksum}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: .release-artifacts/code.tar.gz
          tag_name: ${{ env.delivery_version }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
      - name: re-download and verify published asset
        if: steps.version.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          published_dir=.release-artifacts/published
          rm -rf "$published_dir"
          mkdir -p "$published_dir"
          gh release download "$delivery_version" -p code.tar.gz -D "$published_dir"
          archive="$published_dir/code.tar.gz"
          if [[ ! -f "$archive" ]]; then
            echo "Published release is missing the code.tar.gz asset." >&2
            exit 1
          fi
          expected_sha256="$(cut -d ' ' -f1 .release-artifacts/code.tar.gz.sha256)"
          published_sha256="$(sha256sum "$archive" | cut -d ' ' -f1)"
          if [[ "$published_sha256" != "$expected_sha256" ]]; then
            echo "Published asset SHA-256 mismatch; the release is not the verified package." >&2
            exit 1
          fi
          python3 - "$archive" <<'PY'
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as package:
              members = package.getnames()
          if "src/core.sh" not in members:
              raise SystemExit("published asset is missing src/core.sh")
          if "core.sh" in members:
              raise SystemExit("published asset must not contain the removed root management script")
          PY
          {
            echo '### Published release asset verified'
            echo
            echo "- version: ${delivery_version}"
            echo "- sha256: ${published_sha256}"
          } >> "$GITHUB_STEP_SUMMARY"
