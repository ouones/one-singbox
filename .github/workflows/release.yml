name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-release
  queue: max

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: offline regression and Bash syntax gate
        run: |
          set -euo pipefail
          shell_count=0
          while IFS= read -r -d '' shell_file; do
            bash -n "$shell_file"
            shell_count=$((shell_count + 1))
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if ((shell_count == 0)); then
            echo "No Bash scripts found for syntax validation." >&2
            exit 1
          fi
          sudo -n bash tests-nginx-reality-frontend.sh
          sudo -n bash tests-nginx-reality-node-bindings.sh
          sudo -n bash tests-node-name-label.sh
          sudo -n bash tests-node-proxy-outbound.sh
          bash tests-skill-inventory.sh
      - name: bump version
        run: |
          matching_tag=""
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then
            for tag in $(git tag --list 'v1.*' --sort=-version:refname); do
              tag_commit="$(git rev-parse "${tag}^{commit}")"
              tag_parent="$(git rev-list --parents -n1 "$tag_commit" | cut -d' ' -f2)"
              if [[ "$tag_commit" == "$GITHUB_SHA" || "$tag_parent" == "$GITHUB_SHA" ]]; then
                matching_tag="$tag"
                break
              fi
            done
          fi
          if [[ -n "$matching_tag" ]]; then
            if [[ ! "$matching_tag" =~ ^v1\.[0-9]+$ ]]; then
              echo "Could not determine the current v1.N release version." >&2
              exit 1
            fi
            release_version="$matching_tag"
            release_commit="$(git rev-parse "${matching_tag}^{commit}")"
            sed -i "s/^is_sh_ver=.*/is_sh_ver=${release_version}/" sing-box.sh
          else
            latest_tag="$(git tag --list 'v1.*' --sort=-version:refname | head -n1)"
            latest_minor="${latest_tag#v1.}"
            current_version="$(sed -n 's/^is_sh_ver=//p' sing-box.sh)"
            current_minor="${current_version#v1.}"
            if [[ ! "$latest_minor" =~ ^[0-9]+$ || ! "$current_minor" =~ ^[0-9]+$ ]]; then
              echo "Could not determine the current v1.N release version." >&2
              exit 1
            fi
            if (( current_minor > latest_minor )); then
              release_minor="$current_minor"
            else
              release_minor=$((latest_minor + 1))
            fi
            release_version="v1.${release_minor}"
            sed -i "s/^is_sh_ver=.*/is_sh_ver=${release_version}/" sing-box.sh
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sing-box.sh
            if ! git diff --cached --quiet; then
              git commit -m "chore: bump version to ${release_version}"
            fi
            release_commit="$(git rev-parse HEAD)"
            git tag "$release_version" "$release_commit"
          fi
          echo "is_sh_ver=${release_version}" >> "$GITHUB_ENV"
          echo "release_commit=${release_commit}" >> "$GITHUB_ENV"
      - name: tar
        run: |
          mkdir -p .release-artifacts
          tar zcvf .release-artifacts/code.tar.gz install.sh core.sh sing-box.sh src LICENSE README.md docs/usage.md docs/nginx-reality-frontend-support.md assets/readme
      - name: update main version
        run: |
          for attempt in {1..10}; do
            git fetch origin main
            git checkout --detach origin/main
            sed -i "s/^is_sh_ver=.*/is_sh_ver=${is_sh_ver}/" sing-box.sh
            git add sing-box.sh
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "chore: bump version to ${is_sh_ver}"
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              exit 1
            fi
          done
          git push origin "${is_sh_ver}"
      - name: release
        uses: softprops/action-gh-release@v1
        with:
          files: .release-artifacts/code.tar.gz
          tag_name: ${{ env.is_sh_ver }}
          target_commitish: ${{ env.release_commit }}
